[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steerdistill"
version = "0.1.0"
description = "Online teacher-steered trajectory distillation for quantized LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Anonymous authors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[project.entry-points."vllm.general_plugins"]
steerdistill = "steerdistill.quantization.vllm_plugin:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
steerdistill = ["training/config/*.yaml", "training/config/*.json"]
